services:
  admin:
    build: ./admin
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
    environment:
      - SKILLS_REPO_PATH=/workspace
      - ADMIN_SECRET_TOKEN=${ADMIN_SECRET_TOKEN:-changeme}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html/frontend:ro
      - ./.claude-plugin:/usr/share/nginx/html/.claude-plugin:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - admin
    restart: unless-stopped
